<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="/stylesheet.css">
  </head>
  
  <body>  
        
    <nav class="navbar navbar-expand-lg bg-body-tertiary mb-5">
        <div class="container-fluid ">
            <img class="navbar-brand " src="/product-icon.png" alt="Product Icon" width="30" height="40">
            <p class="navbar-brand mb-0 h1">Product Orginizer</p>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
                <a class="nav-link active" aria-current="page" href="/Project_main_page.html">Home</a>
                <a class="nav-link" href="/add_product.html">Add A Product</a>
            </div>
            </div>
        </div>
    </nav>

    <main class="container mb-5">
 
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Products</h2>
        <a href="/add_product.html" class="btn btn-primary">+ Add Product</a>
      </div>
 
      <!-- Loading spinner -->
      <div id="loading-state" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading products…</span>
        </div>
        <p class="mt-3 text-muted">Loading products…</p>
      </div>
 
      <!-- Error message -->
      <div id="error-state" class="alert alert-danger" role="alert">
        <strong>Could not load products.</strong>
        <span id="error-message"></span>
        <button class="btn btn-sm btn-outline-danger ms-3" onclick="loadProducts()">Retry</button>
      </div>
 
      <!-- Empty state -->
      <div id="empty-state" class="text-center py-5">
        <p class="text-muted fs-5">No products found.</p>
        <a href="/add_product.html" class="btn btn-primary">Add your first product</a>
      </div>
 
      <!-- ── Card grid (populated by JS) ── -->
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-4 g-4" id="product-grid">
        <!-- Cards are injected here -->
      </div>
 
    </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  
  <script>
      // ── Config ──────────────────────────────────────────────────────────────
      // Change this to your Flask/FastAPI endpoint that returns products as JSON
      const API_URL = "/api/products";
 
      // ── Helpers ─────────────────────────────────────────────────────────────
      function showOnly(id) {
        ["loading-state", "error-state", "empty-state", "product-grid"]
          .forEach(el => {
            const node = document.getElementById(el);
            // grid uses display:flex via Bootstrap; others use display:block
            node.style.display = (el === id)
              ? (el === "product-grid" ? "" : "block")   // "" restores Bootstrap's class
              : "none";
          });
      }
 
      // Build a single card column element from a product object.
      // Expected product shape from MongoDB / Python:
      // {
      //   _id:         "64abc…",
      //   name:        "Product Name",
      //   description: "Short description",
      //   price:       19.99,         // optional
      //   image_url:   "/img/x.jpg",  // optional – falls back to placeholder
      //   detail_url:  "/product/64abc…"  // optional link
      // }
      function createCard(product) {
        const col = document.createElement("div");
        col.className = "col";
 
        const imgSrc   = product.image_url  || "https://placehold.co/400x180?text=No+Image";
        const imgAlt   = product.name       || "Product image";
        const title    = product.name       || "Untitled";
        const desc     = product.description|| "No description available.";
        const price    = product.price != null
                           ? `<span class="badge bg-success fs-6 mb-2">$${Number(product.price).toFixed(2)}</span>`
                           : "";
        const detailUrl = product.detail_url || "#";
 
        col.innerHTML = `
          <div class="card product-card shadow-sm">
            <img src="${imgSrc}" class="card-img-top" alt="${imgAlt}"
                 onerror="this.src='https://placehold.co/400x180?text=No+Image'">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">${title}</h5>
              ${price}
              <p class="card-text text-muted flex-grow-1">${desc}</p>
              <a href="${detailUrl}" class="btn btn-primary mt-2">View Details</a>
            </div>
          </div>`;
 
        return col;
      }
 
      // ── Main fetch function ─────────────────────────────────────────────────
      async function loadProducts() {
        showOnly("loading-state");
 
        try {
          const response = await fetch(API_URL);
 
          if (!response.ok) {
            throw new Error(`Server returned ${response.status} ${response.statusText}`);
          }
 
          const products = await response.json();
 
          if (!Array.isArray(products) || products.length === 0) {
            showOnly("empty-state");
            return;
          }
 
          const grid = document.getElementById("product-grid");
          grid.innerHTML = "";                        // clear old cards
          products.forEach(p => grid.appendChild(createCard(p)));
          showOnly("product-grid");
 
        } catch (err) {
          document.getElementById("error-message").textContent = " " + err.message;
          showOnly("error-state");
          console.error("Failed to load products:", err);
        }
      }
 
      // ── Run on page load ────────────────────────────────────────────────────
      document.addEventListener("DOMContentLoaded", loadProducts);
    </script>
    
</body>
</html>
