<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  
  <body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <nav class="navbar navbar-expand-lg bg-body-tertiary mb-5">
        <div class="container-fluid">
            <p class="navbar-brand mb-0 h1">Product Organizer</p>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
                <a class="nav-link active" aria-current="page" href="/">Home</a>
                <a class="nav-link" href="/add_product">Add A Product</a>
            </div>
            </div>
        </div>
    </nav>
    
    <div class="container">
        <h1 style="margin-bottom: 50px;">Add a Product</h1>

        <form id="add-product-form" novalidate>
            <div class="mb-3">
                <label for="Product_name" class="form-label">Product Name</label>
                <input class="form-control" id="Product_name" name="Product_name" placeholder="Enter product name" required>
                <div class="invalid-feedback">Product name is required.</div>
            </div>

            <div class="mb-3">
                <label for="Description" class="form-label">Description</label>
                <textarea class="form-control" id="Description" name="Description" rows="3" placeholder="Enter product description" required></textarea>
                <div class="invalid-feedback">Please enter a description.</div>
            </div>

            <div class="mb-3">
                <label for="Stock" class="form-label">Stock</label>
                <input type="number" class="form-control" id="Stock" name="Stock" min="0" placeholder="Eg: 5" required>
                <div class="invalid-feedback">Stock must be a whole number of 0 or more.</div>
            </div>

            <div class="mb-3">
                <label for="Price" class="form-label">Price</label>
                <input type="number" class="form-control" id="Price" name="Price" min="0" step="0.01" placeholder="Eg: 19.99" required>
                <div class="invalid-feedback">Price must be a positive decimal number.</div>
            </div>

            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>

    <script>
        async function checkAndSubmit(form) {
            const response = await fetch("/api/add_product", {
                method: "POST",
                body: new FormData(form)
            });

            const data = await response.json();
            const alert = document.createElement("div");
            alert.id = "product-alert";
            alert.setAttribute("role", "alert");

            const existingAlert = document.getElementById("product-alert");
            if (existingAlert) existingAlert.remove();

            if (response.ok) {
                alert.className = "alert alert-success";
                alert.textContent = "Product added successfully!";
                form.reset();
                form.classList.remove("was-validated");
            } else {
                alert.className = "alert alert-danger";
                alert.textContent = data.error;
            }

            form.prepend(alert);
        }

        document.getElementById("add-product-form").addEventListener("submit", function(event) {
            event.preventDefault();
            const form = event.target;

            const stock = document.getElementById("Stock");
            if (stock.value.includes(".")) {
                stock.setCustomValidity("Stock must be a whole number.");
            } else {
                stock.setCustomValidity("");
            }

            if (!form.checkValidity()) {
                form.classList.add("was-validated");
                return;
            }

            checkAndSubmit(form);
        });

    </script>

  </body>
</html>
